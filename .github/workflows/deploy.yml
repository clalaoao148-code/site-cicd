# Workflow автоматической публикации сайта на GitHub Pages
# Путь в репозитории: .github/workflows/deploy.yml
 
name: Deploy static site   # название (видно на вкладке Actions)
 
# Триггер: запуск при каждом push в ветку main
on:
  push:
    branches: [ main ]
 
# Права, необходимые для публикации на GitHub Pages
permissions:
  contents: read    # чтение файлов репозитория
  pages: write      # разрешение на публикацию в Pages
  id-token: write   # OIDC-токен для подтверждения деплоя
 
jobs:
  deploy:                    # задание: опубликовать сайт
    runs-on: ubuntu-latest   # виртуальная машина-исполнитель
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Шаг 1. Скопировать файлы репозитория на виртуальную машину
      - name: Checkout repository
        uses: actions/checkout@v4
 
      # Шаг 2. Подготовить окружение GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5
 
      # Шаг 3. Упаковать файлы сайта в артефакт
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
 
      # Шаг 4. Опубликовать артефакт на GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
